services:
  - type: web
    name: cyberdefense-nexora
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 app:app
    envVars:
      - key: CYBERDEFENSE_SECRET
        generateValue: true
      - key: CYBERDEFENSE_ADMIN_PASSWORD
        sync: false
      - key: CYBERDEFENSE_DEMO_PASSWORD
        sync: false
